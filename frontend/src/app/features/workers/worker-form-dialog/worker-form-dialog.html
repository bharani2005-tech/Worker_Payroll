<h2 mat-dialog-title class="font-display font-bold">{{ isEdit ? 'Edit Worker' : 'Add New Worker' }}</h2>

<mat-dialog-content class="!pt-2">
  @if (errorMessage()) {
    <div class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">{{ errorMessage() }}</div>
  }

  <form [formGroup]="form" class="flex flex-col gap-1">
    @if (!isEdit) {
      <div class="grid grid-cols-2 gap-3">
        <mat-form-field appearance="outline">
          <mat-label>Full name</mat-label>
          <input matInput formControlName="name" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Employee code</mat-label>
          <input matInput formControlName="employeeCode" placeholder="EMP004" />
        </mat-form-field>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Temporary password</mat-label>
          <input matInput type="password" formControlName="password" />
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline">
        <mat-label>Phone (optional)</mat-label>
        <input matInput formControlName="phone" />
      </mat-form-field>
    }

    <div class="grid grid-cols-2 gap-3">
      <mat-form-field appearance="outline">
        <mat-label>Department</mat-label>
        <input matInput formControlName="department" placeholder="Production" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Designation</mat-label>
        <input matInput formControlName="designation" placeholder="Machine Operator" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Salary type</mat-label>
      <mat-select formControlName="salaryType">
        <mat-option value="daily">Daily Rate</mat-option>
        <mat-option value="task">Task-Based</mat-option>
      </mat-select>
    </mat-form-field>

    @if (isDaily) {
      <mat-form-field appearance="outline">
        <mat-label>Daily rate (₹)</mat-label>
        <input matInput type="number" formControlName="dailyRate" min="0" />
      </mat-form-field>
    } @else {
      <mat-form-field appearance="outline">
        <mat-label>Rate per task (₹)</mat-label>
        <input matInput type="number" formControlName="taskRate" min="0" />
      </mat-form-field>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="!pb-4 !px-6">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="submit()" [disabled]="loading()">
    @if (loading()) {
      <mat-spinner diameter="20" class="inline-block align-middle"></mat-spinner>
    } @else {
      {{ isEdit ? 'Save changes' : 'Add worker' }}
    }
  </button>
</mat-dialog-actions>
