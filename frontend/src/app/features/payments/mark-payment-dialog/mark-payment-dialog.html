<h2 mat-dialog-title class="font-display font-bold">Record Payment</h2>

<mat-dialog-content class="!pt-2">
  <p class="text-sm text-slate-500 mb-4">
    Outstanding balance: <span class="font-mono-num font-semibold text-slate-800">₹{{ data.payment.amountDue - data.payment.amountPaid | number: '1.0-0' }}</span>
  </p>

  @if (errorMessage()) {
    <div class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">{{ errorMessage() }}</div>
  }

  <form [formGroup]="form" class="flex flex-col gap-1">
    <mat-form-field appearance="outline">
      <mat-label>Amount to pay now (₹)</mat-label>
      <input matInput type="number" formControlName="amountPaid" min="0" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Payment method</mat-label>
      <mat-select formControlName="paymentMethod">
        <mat-option value="cash">Cash</mat-option>
        <mat-option value="bank_transfer">Bank Transfer</mat-option>
        <mat-option value="upi">UPI</mat-option>
        <mat-option value="cheque">Cheque</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Notes (optional)</mat-label>
      <textarea matInput formControlName="notes" rows="2"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="!pb-4 !px-6">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="submit()" [disabled]="loading()">
    @if (loading()) {
      <mat-spinner diameter="20" class="inline-block align-middle"></mat-spinner>
    } @else {
      Confirm payment
    }
  </button>
</mat-dialog-actions>
