<h2 mat-dialog-title class="font-display font-bold">Generate Payroll</h2>

<mat-dialog-content class="!pt-2">
  @if (errorMessage()) {
    <div class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">{{ errorMessage() }}</div>
  }

  <form [formGroup]="form" class="flex flex-col gap-1">
    <mat-form-field appearance="outline">
      <mat-label>Worker</mat-label>
      <mat-select formControlName="workerId">
        @for (w of workers(); track w._id) {
          <mat-option [value]="w._id">{{ w.user.name }} ({{ w.employeeCode }})</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <div class="grid grid-cols-2 gap-3">
      <mat-form-field appearance="outline">
        <mat-label>Period start</mat-label>
        <input matInput [matDatepicker]="startPicker" formControlName="periodStart" />
        <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Period end</mat-label>
        <input matInput [matDatepicker]="endPicker" formControlName="periodEnd" />
        <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
        <mat-datepicker #endPicker></mat-datepicker>
      </mat-form-field>
    </div>

    <p class="text-xs text-slate-400">
      Earnings due will be calculated by summing all work entries within this date range.
    </p>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="!pb-4 !px-6">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="submit()" [disabled]="loading()">
    @if (loading()) {
      <mat-spinner diameter="20" class="inline-block align-middle"></mat-spinner>
    } @else {
      Generate
    }
  </button>
</mat-dialog-actions>
